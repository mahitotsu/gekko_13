# 認可サーバーは、SVID で TLS を自分で終える。spiffe-helper が SVID_DIR に書き、入れ替わったら読み直す（reload-on-update）。
# 証明書を示さない呼び手（client_secret の窓口）も受けるので、client-auth は want にする。示された証明書は、SPIRE のバンドルで確かめる。
server:
  port: 8443
  ssl:
    bundle: svid
    client-auth: want
# 認可の記録は、データベースに置く（段 D の D1-a1）。AWS では、AWS の JDBC ラッパーで IAM のデータベース認証にし、パスワードを置かない。
# 表は起動のときに、なければ作る（schema.sql。2 つのタスクが同時に作らないよう、アドバイザリーロックを取る）
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:software.amazon.jdbc.Driver}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  ssl:
    bundle:
      watch:
        file:
          quiet-period: 1s
      pem:
        svid:
          reload-on-update: true
          keystore:
            certificate: file:${SVID_DIR:/svid}/svid.pem
            private-key: file:${SVID_DIR:/svid}/svid_key.pem
          truststore:
            certificate: file:${SVID_DIR:/svid}/svid_bundle.pem
gekko:
  issuer: ${ISSUER:https://auth:8443}
  trust-domain: ${TRUST_DOMAIN:gekko13.internal}
  standin-secret: ${STANDIN_SECRET}
logging:
  level:
    org.springframework.boot.ssl: info
