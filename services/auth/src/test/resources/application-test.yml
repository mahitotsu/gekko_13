# 試験では、PostgreSQL の代わりに、メモリの H2（PostgreSQL の互換の形）を使う。表の定義は schema-test.sql（アドバイザリーロックを除いた同じもの）。
# 認可の記録を JSON で書いて読み戻す道（Jackson の許可の一覧）も、試験で通る。
spring:
  datasource:
    url: jdbc:h2:mem:auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      schema-locations: classpath:schema-test.sql
gekko:
  login-url: http://login.test
  jwt-svid-file: /nonexistent
