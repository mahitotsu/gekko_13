server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  trust_domain = "gekko13.internal"
  data_dir     = "/run/spire/data"
  log_level    = "INFO"
  # SVID の既定の有効期限。登録ごとに -x509SVIDTTL でも決める（シナリオ 2）
  default_x509_svid_ttl = "5m"
  ca_ttl = "24h"
}
plugins {
  DataStore "sql" {
    plugin_data {
      database_type     = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }
  # ローカルでは join_token。AWS では aws_iid に替える
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "memory" {
    plugin_data {}
  }
}
