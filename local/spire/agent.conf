agent {
  data_dir          = "/run/spire/data"
  log_level         = "INFO"
  server_address    = "spire-server"
  server_port       = "8081"
  socket_path       = "/run/spire/sockets/agent.sock"
  trust_bundle_path = "/run/spire/bundle/bundle.crt"
  trust_domain      = "gekko13.internal"
}
plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "memory" {
    plugin_data {}
  }
  # ECS が付けるコンテナのラベルで、ワークロードを見分ける。ECS on EC2 と同じ docker の attestor を使う
  WorkloadAttestor "docker" {
    plugin_data {}
  }
}
