AWSTemplateFormatVersion: "2010-09-09"
# gekko13 の検証を観察するダッシュボード（段 D の D1-a3。docs/design-decisions.md の判断 57）。
# 無料枠（3 つまで、1 つにメトリクス 50 まで）に収めるため、メトリクスの参照は 43 個にし、タスクの数は ECS の標準のメトリクス（LiveTaskCount）で見る
# （Container Insights は使わない）。ログの集計（Logs Insights）は、開いて読み込むたびに、読んだ量の料金がかかる（無料枠は月 5 GB）。
# CloudFormation は ASCII 以外の文字を「?」に置き換えるので、見出しは英語で書く（docs/findings.md の 2-1）。
Description: >-
  gekko13 observation dashboard: hosts, tasks per service, Aurora capacity, the entry relay and CloudFront,
  and the main-flow events from the task logs. Metric references stay within the free tier (43).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Prefix:
    Type: String
    Default: gekko13
  ClusterName:
    Type: String
  AutoScalingGroupName:
    Type: String
  CapacityProviderName:
    Type: String
  DbClusterId:
    Type: String
  DistributionId:
    Type: String
  AppLogGroup:
    Type: String
    Default: /gekko13/ecs
  EntryLogGroup:
    Type: String
    Default: /aws/lambda/web/gekko13-entry

Resources:
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Metadata:
      com.aws.cloudformation.Context:
        why: One dashboard for the verification. Free tier covers three dashboards with up to 50 metrics each
    Properties:
      DashboardName: !Ref Prefix
      DashboardBody: !Sub |
        {
          "start": "-PT3H",
          "periodOverride": "inherit",
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 6, "height": 3, "properties": {"title": "Hosts in service (now)", "region": "${AWS::Region}", "view": "singleValue", "stat": "Maximum", "period": 60, "metrics": [["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroupName}", {"label": "hosts"}]], "setPeriodToTimeRange": false, "sparkline": true}},
            {"type": "metric", "x": 6, "y": 0, "width": 6, "height": 3, "properties": {"title": "Live tasks per service (now)", "region": "${AWS::Region}", "view": "singleValue", "stat": "Maximum", "period": 60, "metrics": [["AWS/ECS", "LiveTaskCount", "ClusterName", "${ClusterName}", "ServiceName", "spire-server"], ["...", "keycloak"], ["...", "auth"], ["...", "customer-app"], ["...", "sales-agent"], ["...", "insurer-mcp"], ["...", "insurer-backend"], ["...", "insurer-audit"]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 6, "height": 3, "properties": {"title": "Aurora now: ACU / connections", "region": "${AWS::Region}", "view": "singleValue", "stat": "Maximum", "period": 60, "metrics": [["AWS/RDS", "ServerlessDatabaseCapacity", "DBClusterIdentifier", "${DbClusterId}", {"label": "ACU"}], ["AWS/RDS", "DatabaseConnections", "DBClusterIdentifier", "${DbClusterId}", {"label": "connections"}]], "sparkline": true}},
            {"type": "metric", "x": 18, "y": 0, "width": 6, "height": 3, "properties": {"title": "CloudFront over the range: requests / 5xx %", "region": "us-east-1", "view": "singleValue", "stat": "Maximum", "period": 60, "metrics": [["AWS/CloudFront", "Requests", "DistributionId", "${DistributionId}", "Region", "Global", {"stat": "Sum", "label": "requests"}], ["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${DistributionId}", "Region", "Global", {"stat": "Average", "label": "5xx %"}]], "setPeriodToTimeRange": true}},
            {"type": "metric", "x": 0, "y": 3, "width": 6, "height": 4, "properties": {"title": "Hosts: in service and desired", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroupName}", {"label": "in service"}], ["AWS/AutoScaling", "GroupDesiredCapacity", "AutoScalingGroupName", "${AutoScalingGroupName}", {"label": "desired"}]], "yAxis": {"left": {"min": 0}}}},
            {"type": "metric", "x": 6, "y": 3, "width": 6, "height": 4, "properties": {"title": "Managed scaling: reservation % (100 = just enough)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/ECS/ManagedScaling", "CapacityProviderReservation", "CapacityProviderName", "${CapacityProviderName}", "ClusterName", "${ClusterName}", {"label": "reservation %%"}]], "annotations": {"horizontal": [{"value": 100, "label": "target"}]}, "yAxis": {"left": {"min": 0}}}},
            {"type": "metric", "x": 12, "y": 3, "width": 6, "height": 4, "properties": {"title": "Live tasks per service", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/ECS", "LiveTaskCount", "ClusterName", "${ClusterName}", "ServiceName", "spire-server"], ["...", "keycloak"], ["...", "auth"], ["...", "customer-app"], ["...", "sales-agent"], ["...", "insurer-mcp"], ["...", "insurer-backend"], ["...", "insurer-audit"]], "yAxis": {"left": {"min": 0}}}},
            {"type": "metric", "x": 18, "y": 3, "width": 6, "height": 4, "properties": {"title": "Aurora capacity (ACU)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/RDS", "ServerlessDatabaseCapacity", "DBClusterIdentifier", "${DbClusterId}", {"label": "ACU"}]], "yAxis": {"left": {"min": 0}}}},
            {"type": "metric", "x": 0, "y": 7, "width": 6, "height": 4, "properties": {"title": "Memory per service (% of reservation)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/ECS", "MemoryUtilization", "ClusterName", "${ClusterName}", "ServiceName", "spire-server"], ["...", "keycloak"], ["...", "auth"], ["...", "customer-app"], ["...", "sales-agent"], ["...", "insurer-mcp"], ["...", "insurer-backend"], ["...", "insurer-audit"]], "yAxis": {"left": {"min": 0}}}},
            {"type": "metric", "x": 6, "y": 7, "width": 6, "height": 4, "properties": {"title": "CPU per service (% of reservation)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/ECS", "CPUUtilization", "ClusterName", "${ClusterName}", "ServiceName", "spire-server"], ["...", "keycloak"], ["...", "auth"], ["...", "customer-app"], ["...", "sales-agent"], ["...", "insurer-mcp"], ["...", "insurer-backend"], ["...", "insurer-audit"]], "yAxis": {"left": {"min": 0}}}},
            {"type": "metric", "x": 12, "y": 7, "width": 6, "height": 4, "properties": {"title": "Aurora connections", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/RDS", "DatabaseConnections", "DBClusterIdentifier", "${DbClusterId}", {"label": "connections"}]], "yAxis": {"left": {"min": 0}}}},
            {"type": "metric", "x": 18, "y": 7, "width": 6, "height": 4, "properties": {"title": "CloudFront 5xx rate (%)", "region": "us-east-1", "view": "timeSeries", "stat": "Maximum", "period": 60, "metrics": [["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${DistributionId}", "Region", "Global", {"stat": "Average", "label": "5xx %"}]], "yAxis": {"left": {"min": 0}}}},
            {"type": "log", "x": 0, "y": 11, "width": 6, "height": 4, "properties": {"title": "Entry relay outcomes per minute", "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "query": "SOURCE '${EntryLogGroup}' | filter @message like /proxied|upstream-failed/ | parse @message /ev\\W+(?<ev>[a-z-]+)/ | parse @message /status\\W+(?<code>\\d+)/ | parse @message /kind\\W+(?<kind>retryable|fatal)/ | fields concat(ev, ' ', coalesce(code, kind)) as outcome | stats count(*) by bin(1m), outcome"}},
            {"type": "log", "x": 6, "y": 11, "width": 6, "height": 4, "properties": {"title": "Main flow: audit records per minute (by kind)", "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "query": "SOURCE '${AppLogGroup}' | filter @message like /\"audit\"/ | parse @message /\"kind\"\\s*:\\s*\"(?<kind>[a-z_]+)\"/ | stats count(*) by bin(1m), kind"}},
            {"type": "log", "x": 12, "y": 11, "width": 6, "height": 4, "properties": {"title": "Failures by service (total over the range)", "region": "${AWS::Region}", "view": "bar", "stacked": false, "query": "SOURCE '${AppLogGroup}' | filter @message like /ECONNRESET|agent_unavailable|I\\/O error|refused|socket disconnected|Exception/ and @message not like /^\\s/ and @message not like /^Caused by/ | parse @logStream /^(?<svc>[^\\/]+)\\// | stats count(*) as failures by svc | sort failures desc"}},
            {"type": "log", "x": 18, "y": 11, "width": 6, "height": 4, "properties": {"title": "Startup: when each service became ready", "region": "${AWS::Region}", "view": "table", "stacked": false, "query": "SOURCE '${AppLogGroup}' | filter @message like /\"listening\"|Started [A-Za-z]+Application|Keycloak [0-9.]+ on JVM .*started|\"msg\":\"listening\"/ | parse @logStream /^(?<svc>[^\\/]+)\\// | stats min(@timestamp) as first_ready, max(@timestamp) as last_ready, count(*) as starts by svc | sort first_ready asc"}}
          ]
        }

Outputs:
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Prefix}"
