AWSTemplateFormatVersion: "2010-09-09"
# gekko13 の検証を観察するダッシュボード（段 D の D1-a3。docs/design-decisions.md の判断 57）。
# 無料枠（3 つまで、1 つにメトリクス 50 まで）に収めるため、メトリクスは 31 個にし、タスクの数は ECS の標準のメトリクス（LiveTaskCount）で見る
# （Container Insights は使わない）。ログの集計（Logs Insights）は、開いて読み込むたびに、読んだ量の料金がかかる（無料枠は月 5 GB）。
# CloudFormation は ASCII 以外の文字を「?」に置き換えるので、見出しは英語で書く（docs/findings.md の 2-1）。
Description: >-
  gekko13 observation dashboard: hosts, tasks per service, Aurora capacity, the entry relay and CloudFront,
  and the main-flow events from the task logs. Metrics stay within the free tier (31 metrics).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Prefix:
    Type: String
    Default: gekko13
  ClusterName:
    Type: String
  AutoScalingGroupName:
    Type: String
  CapacityProviderName:
    Type: String
  DbClusterId:
    Type: String
  DistributionId:
    Type: String
  AppLogGroup:
    Type: String
    Default: /gekko13/ecs
  EntryLogGroup:
    Type: String
    Default: /aws/lambda/web/gekko13-entry

Resources:
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Metadata:
      com.aws.cloudformation.Context:
        why: One dashboard for the verification. Free tier covers three dashboards with up to 50 metrics each
    Properties:
      DashboardName: !Ref Prefix
      DashboardBody: !Sub |
        {
          "start": "-PT3H",
          "periodOverride": "inherit",
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown": "## ${Prefix}: hosts and tasks, Aurora, entry, main flow\nTask count is LiveTaskCount (no Container Insights). Log widgets run Logs Insights queries each time they load."}},

            {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6, "properties": {"title": "Hosts (ASG) and managed scaling", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
              "metrics": [
                ["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroupName}", {"label": "in service"}],
                ["AWS/AutoScaling", "GroupDesiredCapacity", "AutoScalingGroupName", "${AutoScalingGroupName}", {"label": "desired"}],
                ["AWS/ECS/ManagedScaling", "CapacityProviderReservation", "CapacityProviderName", "${CapacityProviderName}", "ClusterName", "${ClusterName}", {"label": "reservation %", "yAxis": "right"}]
              ]}},
            {"type": "metric", "x": 8, "y": 2, "width": 16, "height": 6, "properties": {"title": "Live tasks per service", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
              "metrics": [
                ["AWS/ECS", "LiveTaskCount", "ClusterName", "${ClusterName}", "ServiceName", "spire-server"],
                ["...", "keycloak"], ["...", "auth"], ["...", "customer-app"], ["...", "sales-agent"],
                ["...", "insurer-mcp"], ["...", "insurer-backend"], ["...", "insurer-audit"]
              ]}},

            {"type": "metric", "x": 0, "y": 8, "width": 12, "height": 6, "properties": {"title": "Memory utilization per service (% of reservation)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
              "metrics": [
                ["AWS/ECS", "MemoryUtilization", "ClusterName", "${ClusterName}", "ServiceName", "spire-server"],
                ["...", "keycloak"], ["...", "auth"], ["...", "customer-app"], ["...", "sales-agent"],
                ["...", "insurer-mcp"], ["...", "insurer-backend"], ["...", "insurer-audit"]
              ]}},
            {"type": "metric", "x": 12, "y": 8, "width": 12, "height": 6, "properties": {"title": "CPU utilization per service (% of reservation)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
              "metrics": [
                ["AWS/ECS", "CPUUtilization", "ClusterName", "${ClusterName}", "ServiceName", "spire-server"],
                ["...", "keycloak"], ["...", "auth"], ["...", "customer-app"], ["...", "sales-agent"],
                ["...", "insurer-mcp"], ["...", "insurer-backend"], ["...", "insurer-audit"]
              ]}},

            {"type": "metric", "x": 0, "y": 14, "width": 8, "height": 6, "properties": {"title": "Aurora capacity (ACU) and connections", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
              "metrics": [
                ["AWS/RDS", "ServerlessDatabaseCapacity", "DBClusterIdentifier", "${DbClusterId}", {"label": "ACU"}],
                ["AWS/RDS", "DatabaseConnections", "DBClusterIdentifier", "${DbClusterId}", {"label": "connections", "yAxis": "right"}]
              ]}},
            {"type": "metric", "x": 8, "y": 14, "width": 8, "height": 6, "properties": {"title": "CloudFront requests and 5xx rate", "region": "us-east-1", "view": "timeSeries", "period": 60,
              "metrics": [
                ["AWS/CloudFront", "Requests", "DistributionId", "${DistributionId}", "Region", "Global", {"stat": "Sum", "label": "requests"}],
                ["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${DistributionId}", "Region", "Global", {"stat": "Average", "label": "5xx %", "yAxis": "right"}]
              ]}},
            {"type": "log", "x": 16, "y": 14, "width": 8, "height": 6, "properties": {"title": "Entry relay: status per minute", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false,
              "query": "SOURCE '${EntryLogGroup}' | filter @message like /proxied|upstream-failed/ | parse @message /ev\\W+(?<ev>[a-z-]+)/ | parse @message /status\\W+(?<code>\\d+)/ | parse @message /kind\\W+(?<kind>retryable|fatal)/ | fields concat(ev, ' ', coalesce(code, kind)) as outcome | stats count(*) by bin(1m), outcome"}},

            {"type": "log", "x": 0, "y": 20, "width": 12, "height": 6, "properties": {"title": "Main flow: audit records per minute (conversation, tool calls, contracts)", "region": "${AWS::Region}", "view": "timeSeries", "stacked": true,
              "query": "SOURCE '${AppLogGroup}' | filter @message like /\"audit\"/ | parse @message /\"kind\"\\s*:\\s*\"(?<kind>[a-z_]+)\"/ | stats count(*) by bin(1m), kind"}},
            {"type": "log", "x": 12, "y": 20, "width": 12, "height": 6, "properties": {"title": "Failures in the task logs per minute (by service)", "region": "${AWS::Region}", "view": "timeSeries", "stacked": true,
              "query": "SOURCE '${AppLogGroup}' | filter @message like /ECONNRESET|agent_unavailable|I\\/O error|refused|socket disconnected|Exception/ | parse @logStream /^(?<svc>[^\\/]+)\\// | stats count(*) by bin(1m), svc"}},

            {"type": "log", "x": 0, "y": 26, "width": 24, "height": 6, "properties": {"title": "Latest contracts recorded by the insurer backend", "region": "${AWS::Region}", "view": "table",
              "query": "SOURCE '${AppLogGroup}' | filter audit.kind = \"contract\" | fields @timestamp, audit.contract.contractId as contractId, audit.contract.customer as who, @logStream | sort @timestamp desc | limit 20"}}
          ]
        }

Outputs:
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Prefix}"
