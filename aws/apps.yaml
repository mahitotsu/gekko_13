AWSTemplateFormatVersion: "2010-09-09"
# gekko13 のアプリのスタック（段 D の D0 で、基盤の aws/ecs.yaml から分けた）。基盤のクラスターと名前空間の上に、アプリのサービスを載せる。
# 入口（段 D の D0-b）: CloudFront → 入口のリバースプロキシ（aws/entry.yaml の Web Functions）→ タスク。リバースプロキシは、名前空間の SRV で送り先を見つける。
# ECS が、正常なタスクを、インスタンスの IP と動的なポートの組で SRV に登録する。正常は、コンテナのヘルスチェックで決める（D0 の ALB と同じ URL）。
# 振り分けはリバースプロキシがパスでする。/login は Keycloak、それ以外は edge-check（D1-a で顧客のアプリに替える）。
# インスタンスの数と AZ を前提にしない。ホストのポートは固定せず（HostPort 0）、インスタンスはリバースプロキシのグループからだけ動的なポートを受ける（network のスタック）。
# CloudFormation は ASCII 以外の文字を「?」に置き換えるので、Description と Metadata は英語で書く（docs/findings.md）。
Description: >-
  gekko13 apps on the base runtime (gekko13-ecs): the login server (keycloak), the authorization server (auth) and the edge check.
  CloudFront -> entry relay (Lambda Web Function, aws/entry.yaml) -> tasks. ECS registers healthy tasks in SRV records of the
  namespace by host IP and dynamic port; the relay routes /login to keycloak and everything else to edge-check.
  Nothing assumes a host count or AZ.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Prefix:
    Type: String
    Default: gekko13
  ClusterName:
    Type: String
  CapacityProviderName:
    Type: String
  NamespaceArn:
    Type: String
  NamespaceId:
    Type: String
    Description: ID of the base namespace (gekko13-ecs output NamespaceId). The SRV records of keycloak and edge-check live here
  ExecutionRoleArn:
    Type: String
  LogGroupName:
    Type: String
  AppImage:
    Type: String
    Description: URI and tag of the gekko13/node image in ECR (edge-check)
  AuthImage:
    Type: String
    Description: URI and tag of the gekko13/auth image (Spring Authorization Server) in ECR
  KeycloakImage:
    Type: String
    Description: URI and tag of the gekko13/keycloak image in ECR
  SpiffeHelperImage:
    Type: String
  AuthStandinParameter:
    Type: String
    Default: /gekko13/auth/standin-secret
    Description: SSM SecureString holding the client secret of the user stand-in client of the authorization server
  RpId:
    Type: String
    Default: ""
    Description: Passkey RP ID, the default domain of the entry CloudFront distribution (empty until the distribution exists)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets in two AZs for the awsvpc Keycloak tasks (gekko13-network output SubnetIds)
  HostSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group of the hosts, also used by the awsvpc Keycloak ENIs (JGroups 7800 stays inside the group)
  DbHost:
    Type: String
    Description: Aurora cluster endpoint (gekko13-db output DbHost)
  DbKeycloakPasswordParameter:
    Type: String
    Default: /gekko13/db/keycloak-password
  DbAuthPasswordParameter:
    Type: String
    Default: /gekko13/db/auth-password
  DbCaParameter:
    Type: String
    Default: /gekko13/db/ca
  AuthSigningKeyParameter:
    Type: String
    Default: /gekko13/auth/signing-key
  EdgeTaskCount:
    Type: Number
    Default: 2
    Description: Desired task count of edge-check. Tasks spread over AZs, one per host

Conditions:
  HasRpId: !Not [!Equals [!Ref RpId, ""]]

Resources:
  # 入口のリバースプロキシが引く SRV。ECS が、正常なタスクを、インスタンスの IP と動的なポートの組で登録する（bridge なので SRV だけ）。
  # TTL は 10 秒。止まったタスクには、この間だけ送ることがあり、リバースプロキシがつながらなければ別のタスクへリトライする。
  KeycloakDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          SRV records resolved by the entry relay. ECS registers healthy tasks by host IP and dynamic port (bridge mode allows SRV only).
          TTL 10 seconds
    Properties:
      Name: keycloak
      NamespaceId: !Ref NamespaceId
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: SRV, TTL: 10 }]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  EdgeCheckDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: edge-check
      NamespaceId: !Ref NamespaceId
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: SRV, TTL: 10 }]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  # 段 C の C-3: 認可サーバー（Spring Authorization Server）。SVID で mTLS を自分で終える（C-4。docs/findings.md の 4-4）。
  # Service Connect は TCP の中継だけに使い、auth:8443 で受ける。入口のリバースプロキシには出さない。イメージは SVID が書かれるまで待ってから起動する。
  AuthTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Prefix}-auth"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !Ref ExecutionRoleArn
      Volumes:
        - { Name: config, Host: { SourcePath: /etc/gekko13/spire } }
        - { Name: sockets, Host: { SourcePath: /var/run/gekko13/spire-sockets } }
        - { Name: svid }
      ContainerDefinitions:
        - Name: svid-helper
          Image: !Ref SpiffeHelperImage
          Essential: true
          MemoryReservation: 32
          Command: ["-config", "/etc/gekko13/spire/helper.conf"]
          MountPoints:
            - { SourceVolume: config, ContainerPath: /etc/gekko13/spire, ReadOnly: true }
            - { SourceVolume: sockets, ContainerPath: /run/spire/sockets, ReadOnly: true }
            - { SourceVolume: svid, ContainerPath: /svid }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: auth, mode: non-blocking }
        - Name: app
          Image: !Ref AuthImage
          Essential: true
          # JVM はこの上限の 75% をヒープにする（services/auth/Dockerfile の MaxRAMPercentage）。
          # Cpu は取り分の目安で、上限ではない。タスクのオートスケーリングが、この予約に対する使用率を見る
          Memory: 512
          Cpu: 512
          # svid-helper は root で動き、鍵を root のグループで 0640 にして書く（基盤の UserData の helper.conf）。
          # app は root でない利用者のまま、グループだけ root にして鍵を読む（docs/findings.md の 4-13）
          User: "1000:0"
          PortMappings: [{ Name: app, ContainerPort: 8443, Protocol: tcp }]
          # 8443 で受けられるかを確かめる（イメージに curl がないので、bash の /dev/tcp）。Service Connect は、新しいタスクが
          # HEALTHY になってから通信を回す（ECS の資料）。入れ替えのときも、受けられるようになってから古いタスクを止める
          HealthCheck:
            Command: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8443"]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          Environment:
            - { Name: SVID_DIR, Value: /svid }
            - { Name: ISSUER, Value: https://auth:8443 }
            - { Name: TRUST_DOMAIN, Value: gekko13.internal }
            # 認可の記録は、共有の Aurora に置く。Aurora の証明書を確かめる（DB_CA_PEM を、起動のときにファイルに書く）
            - { Name: DB_URL, Value: !Sub "jdbc:postgresql://${DbHost}:5432/auth?sslmode=verify-full&sslrootcert=/tmp/db-ca.pem" }
            - { Name: DB_DRIVER, Value: org.postgresql.Driver }
            - { Name: DB_USER, Value: auth }
          Secrets:
            - { Name: STANDIN_SECRET, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthStandinParameter}" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbAuthPasswordParameter}" }
            - { Name: DB_CA_PEM, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}" }
            # 2 つのタスクが同じ鍵でトークンを出し、確かめる
            - { Name: AUTH_SIGNING_KEY, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthSigningKeyParameter}" }
          MountPoints:
            - { SourceVolume: svid, ContainerPath: /svid, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: auth, mode: non-blocking }

  # ログインサーバー（Keycloak）。入口のリバースプロキシが、/login と /login/* を送る。保存先は共有の Aurora で、2 タスクで動かす（段 D の D1-a1）。
  # タスクどうしは JGroups（7800）でキャッシュを共有するので、タスクの IP で直接つながる awsvpc にする。相手はデータベースで見つける（jdbc-ping）。
  # レルムは、なければ取り込む（すでにあれば飛ばす）。
  # 管理者の利用者は作らない（管理画面は CloudFront から誰でも届くため）。
  # Host は CloudFront が送り先の名前に替えるので、KC_HOSTNAME に完全な URL を渡し、Host に頼らない。
  KeycloakTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Login server behind the entry relay route for /login. Two tasks share Aurora and an Infinispan cluster over JGroups
          (jdbc-ping discovery), so the tasks use awsvpc to reach each other by task IP. The realm is imported if missing.
          The full URL in KC_HOSTNAME because CloudFront rewrites Host
        must: Never add a bootstrap admin user while the admin console is reachable through CloudFront
    Properties:
      Family: !Sub "${Prefix}-keycloak"
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: app
          Image: !Ref KeycloakImage
          Essential: true
          # Keycloak の JVM は、既定で上限の 70% をヒープにする
          Memory: 1024
          Cpu: 512
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
            - { ContainerPort: 7800, Protocol: tcp }
          # イメージに curl がないので、bash の /dev/tcp で discovery を引き、200 を確かめる
          HealthCheck:
            Command:
              - CMD
              - bash
              - -c
              - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /login/realms/gekko13/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && read -r line <&3 && [[ $line == *" 200 "* ]]'
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 180
          Environment:
            - { Name: KC_HOSTNAME, Value: !Sub "https://${RpId}/login" }
            - { Name: KC_HTTP_ENABLED, Value: "true" }
            - { Name: RP_ID, Value: !Ref RpId }
            - { Name: KC_DB_URL, Value: !Sub "jdbc:postgresql://${DbHost}:5432/keycloak?sslmode=verify-full&sslrootcert=/tmp/db-ca.pem" }
            - { Name: KC_DB_USERNAME, Value: keycloak }
          Secrets:
            - { Name: KC_DB_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbKeycloakPasswordParameter}" }
            - { Name: DB_CA_PEM, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}" }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: keycloak, mode: non-blocking }

  # 確かめのエンドポイント。応答に、タスクと AZ を返す。D0 では、2 つの AZ のどちらのインスタンスにも届くかを、これで確かめる。
  EdgeCheckTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Prefix}-edge-check"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: app
          Image: !Ref AppImage
          Essential: true
          MemoryReservation: 64
          PortMappings:
            - { ContainerPort: 8080, HostPort: 0, Protocol: tcp }
          HealthCheck:
            Command: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/edge-point"]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          Environment:
            - { Name: SERVICE, Value: edge-check }
            - { Name: RP_ID, Value: !Ref RpId }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: edge-check, mode: non-blocking }

  AuthService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: auth
      TaskDefinition: !Ref AuthTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      DesiredCount: 2
      # ローリングアップデートする。AZ に散らす。タスクの数は、オートスケーリングが 2〜4 で変える（AuthScaling）
      # MaximumPercent を 100 にすると、AZ の偏りを ECS が直さない（AvailabilityZoneRebalancing の条件。ECS の資料）
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }]
      HealthCheckGracePeriodSeconds: 120
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref NamespaceArn
        Services: [{ PortName: app, DiscoveryName: auth, ClientAliases: [{ Port: 8443, DnsName: auth }] }]

  # ディストリビューションのドメイン名（RpId）がまだないと、KC_HOSTNAME が作れないので、タスク数を 0 にしておく。
  # 起動からレルムの取り込みまでに時間がかかるので、ヘルスチェックを 180 秒待つ
  KeycloakService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: keycloak
      TaskDefinition: !Ref KeycloakTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      DesiredCount: !If [HasRpId, 2, 0]
      # MaximumPercent を 100 にすると、AZ の偏りを ECS が直さない（AvailabilityZoneRebalancing の条件。ECS の資料）
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref HostSecurityGroupId]
      HealthCheckGracePeriodSeconds: 180
      ServiceRegistries: [{ RegistryArn: !GetAtt KeycloakDiscovery.Arn, ContainerName: app, ContainerPort: 8080 }]

  # AZ に散らし、同じインスタンスに 2 つ置かない。タスク数が 2 なら、インスタンスが 2 台になり、AZ が分かれる
  EdgeCheckService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: edge-check
      TaskDefinition: !Ref EdgeCheckTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      DesiredCount: !Ref EdgeTaskCount
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      PlacementConstraints: [{ Type: distinctInstance }]
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }]
      HealthCheckGracePeriodSeconds: 60
      ServiceRegistries: [{ RegistryArn: !GetAtt EdgeCheckDiscovery.Arn, ContainerName: app, ContainerPort: 8080 }]

  # タスクのオートスケーリング（段 D の D1-a1）。CPU の使用率（予約に対する割合）を 60 % に保つよう、2〜4 で変える。
  # 1 つの方針で、CloudWatch のアラームが 2 つできる（1 つ月 0.1 ドル。持ち主が承認済み）。
  # aws/scale.sh down は、先に最小と最大を 0 にしてから、タスクを 0 にする（ここで 2 に戻されないように）
  KeycloakScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: KeycloakService
    Metadata:
      com.aws.cloudformation.Context:
        why: Target tracking keeps Keycloak CPU near 60 percent with 2 to 4 tasks. Two CloudWatch alarms per policy (approved by the owner)
        must: aws/scale.sh down must set min and max to 0 before scaling tasks to zero
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${ClusterName}/keycloak"
      MinCapacity: !If [HasRpId, 2, 0]
      MaxCapacity: !If [HasRpId, 4, 0]
  KeycloakScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${Prefix}-keycloak-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref KeycloakScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
  AuthScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: AuthService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${ClusterName}/auth"
      MinCapacity: 2
      MaxCapacity: 4
  AuthScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${Prefix}-auth-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AuthScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

Outputs:
  KeycloakDiscoveryId: { Value: !Ref KeycloakDiscovery }
  EdgeCheckDiscoveryId: { Value: !Ref EdgeCheckDiscovery }
