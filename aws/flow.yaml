AWSTemplateFormatVersion: "2010-09-09"
# gekko13 の主の流れのスタック（段 D の D1-a2）。gekko_11 のサービスのうち、apps のスタックにないもの（Keycloak と auth のほか）を置く。
# 顧客のアプリ（画面の配信元と BFF。D1-a2-1）、営業 AI エージェント、事務サービス、保険会社のシステム（D1-a2-2）、監査サービス（D1-a2-3）。
# サービスどうしは、Service Connect の名前（TCP の中継だけ）で呼び、各アプリが SVID の mTLS を終える。呼んでよい相手は、各アプリが SPIFFE ID で決める。
# どのサービスも 2 タスクで、状態は共有の Aurora に置く（段 D の D1-a3。docs/design-decisions.md の判断 53〜56）。
# CloudFormation は ASCII 以外の文字を「?」に置き換えるので、Description と Metadata は英語で書く（docs/findings.md）。
Description: >-
  gekko13 main-flow services on the base runtime (gekko13-ecs): the customer app (web UI and BFF), the sales agent,
  the MCP office service, the insurer backend and the audit service. The entry relay finds the customer app and the audit service
  through SRV records.
  Services call each other by Service Connect names (TCP relay only) and terminate SVID mTLS in the apps.
  Each service runs two tasks and keeps its state in the shared Aurora cluster, so any task can serve the next request.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Prefix:
    Type: String
    Default: gekko13
  ClusterName:
    Type: String
  CapacityProviderName:
    Type: String
  NamespaceId:
    Type: String
    Description: ID of the base namespace (gekko13-ecs output NamespaceId). The SRV record of the customer app lives here
  ExecutionRoleArn:
    Type: String
  LogGroupName:
    Type: String
  AppImage:
    Type: String
    Description: URI and tag of the gekko13/node image in ECR (customer app, and helper-config that writes the spiffe-helper config)
  SalesAgentImage:
    Type: String
    Description: URI and tag of the sales agent image with the Claude Code binary (Dockerfile target sales-agent). Used when SalesAgentEngine is claude
  SalesAgentEngine:
    Type: String
    Default: scripted
    AllowedValues: [scripted, claude]
    Description: Engine of the sales agent. claude runs the real Claude through the Agent SDK with the owner's subscription token (owner-only verification)
  SpiffeHelperImage:
    Type: String
  McpImage:
    Type: String
    Description: URI and tag of the gekko13/insurer-mcp image (Python) in ECR
  BackendImage:
    Type: String
    Description: URI and tag of the gekko13/insurer-backend image (Java) in ECR
  AuditImage:
    Type: String
    Description: URI and tag of the gekko13/insurer-audit image (Go) in ECR
  RpId:
    Type: String
    Description: Passkey RP ID, the default domain of the entry CloudFront distribution. The issuer and the app origin are built from it
  DbHost:
    Type: String
    Description: Aurora cluster endpoint (gekko13-db output DbHost)
  DbCaParameter:
    Type: String
    Default: /gekko13/db/ca
  DbBackendPasswordParameter:
    Type: String
    Default: /gekko13/db/backend-password
  OfferSigningKeyParameter:
    Type: String
    Default: /gekko13/backend/offer-key
  DbCustomerAppPasswordParameter:
    Type: String
    Default: /gekko13/db/customer-app-password
  DbAuditPasswordParameter:
    Type: String
    Default: /gekko13/db/audit-password
  StateKeyParameter:
    Type: String
    Default: /gekko13/customer-app/state-key
    Description: SSM SecureString with the AES-256 key that seals the customer app sessions in Aurora (64 hex characters)
  DbSalesAgentPasswordParameter:
    Type: String
    Default: /gekko13/db/sales-agent-password
  SalesAgentClaudeTokenParameter:
    Type: String
    Default: /gekko13/sales-agent/claude-oauth-token
    Description: SSM SecureString with the owner's Claude subscription token (claude setup-token) for the sales agent when SalesAgentEngine is claude
  SalesAgentStateKeyParameter:
    Type: String
    Default: /gekko13/sales-agent/state-key
    Description: SSM SecureString with the AES-256 key that seals the sales agent conversations in Aurora (64 hex characters)
  EnableTracing:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Load the OpenTelemetry instrumentation and send spans to the collector on the same instance (172.17.0.1:4318)
  Running:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether the services run. The only source of the task counts: true runs two tasks per service, false runs none.
      Change it with aws/scale.sh, never with update-service

Conditions:
  Run: !Equals [!Ref Running, "true"]
  Tracing: !Equals [!Ref EnableTracing, "true"]
  Claude: !Equals [!Ref SalesAgentEngine, claude]

Resources:
  # 入口のリバースプロキシが引く SRV（apps のスタックの Keycloak と同じ形）。ECS が、正常なタスクを、インスタンスの IP と動的なポートの組で登録する
  CustomerAppDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Metadata:
      com.aws.cloudformation.Context:
        why: SRV records resolved by the entry relay. ECS registers healthy tasks by host IP and dynamic port. TTL 10 seconds
    Properties:
      Name: customer-app
      NamespaceId: !Ref NamespaceId
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: SRV, TTL: 10 }]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  # 顧客のアプリ。8080 は入口のリバースプロキシから（画面、BFF、受信箱の読み取り）。9443 は保険会社のシステムからの直送で、SVID の mTLS で受ける
  # （D1-a2-2 で、保険会社のシステムが呼べるようにする）。BFF は、同じ SVID で、営業 AI エージェントと auth を mTLS で呼ぶ。
  # ログインサーバーへは、JWT-SVID（宛先は issuer）でクライアント認証する。helper-config が、その宛先を入れた spiffe-helper の設定を書く
  CustomerAppTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Customer app (web UI and BFF). Port 8080 serves the entry relay. Port 9443 takes direct notices from the insurer backend over SVID mTLS.
          The BFF authenticates to Keycloak with a JWT-SVID whose audience is the login issuer; helper-config writes that spiffe-helper config
        must: Never expose 9443 to the entry relay. Never pass the agent socket to the app container
    Properties:
      Family: !Sub "${Prefix}-customer-app"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !Ref ExecutionRoleArn
      Volumes:
        - { Name: helper }
        - { Name: sockets, Host: { SourcePath: /var/run/gekko13/spire-sockets } }
        - { Name: svid }
      ContainerDefinitions:
        - Name: helper-config
          Image: !Ref AppImage
          Essential: false
          MemoryReservation: 16
          Command: ["sh", "scripts/helper-conf.sh", "/helper/helper.conf"]
          Environment:
            - { Name: JWT_AUDIENCE, Value: !Sub "https://${RpId}/login/realms/insurer" }
          MountPoints:
            - { SourceVolume: helper, ContainerPath: /helper }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: customer-app, mode: non-blocking }
        - Name: svid-helper
          Image: !Ref SpiffeHelperImage
          Essential: true
          MemoryReservation: 32
          Command: ["-config", "/helper/helper.conf"]
          DependsOn: [{ ContainerName: helper-config, Condition: SUCCESS }]
          MountPoints:
            - { SourceVolume: helper, ContainerPath: /helper, ReadOnly: true }
            - { SourceVolume: sockets, ContainerPath: /run/spire/sockets, ReadOnly: true }
            - { SourceVolume: svid, ContainerPath: /svid }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: customer-app, mode: non-blocking }
        - Name: app
          Image: !Ref AppImage
          Essential: true
          MemoryReservation: 128
          # svid-helper は鍵を root のグループで 0640 にして書く。app は root で動くので読める（Node のイメージの既定）
          PortMappings:
            - { ContainerPort: 8080, HostPort: 0, Protocol: tcp }
            - { Name: notice, ContainerPort: 9443, Protocol: tcp }
          HealthCheck:
            Command: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/config.json"]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          Environment:
            - { Name: SERVICE, Value: customer-app }
            - !If [Tracing, { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: "http://172.17.0.1:4318" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_SERVICE_NAME, Value: "customer-app" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_METRICS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_LOGS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: NODE_OPTIONS, Value: "--import=/app/packages/tracing/src/register.ts" }, !Ref AWS::NoValue]
            - { Name: SVID_DIR, Value: /svid }
            - { Name: JWT_SVID_FILE, Value: /svid/jwt_svid.token }
            - { Name: TRUST_DOMAIN, Value: gekko13.internal }
            - { Name: ISSUER, Value: !Sub "https://${RpId}/login/realms/insurer" }
            - { Name: APP_ORIGIN, Value: !Sub "https://${RpId}" }
            - { Name: RP_ID, Value: !Ref RpId }
            - { Name: AUTH_ORIGIN, Value: https://auth:8443 }
            - { Name: AGENT_ORIGIN, Value: https://sales-agent:8443 }
            # セッション、ログインの途中の情報、受信箱は、共有の Aurora に置く（段 D の D1-a3）。セッションは STATE_KEY で暗号化する（判断 54）
            - { Name: DB_URL, Value: !Sub "postgres://${DbHost}:5432/customer_app" }
            - { Name: DB_USER, Value: customer_app }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCustomerAppPasswordParameter}" }
            - { Name: DB_CA_PEM, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}" }
            - { Name: STATE_KEY, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StateKeyParameter}" }
          MountPoints:
            - { SourceVolume: svid, ContainerPath: /svid, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: customer-app, mode: non-blocking }

  # 1 タスク（冗長化は D1-a3）。auth を Service Connect の名前で呼ぶので、クライアントとして Service Connect を有効にする。
  # Service Connect の受け口の名前（customer-app-notice）は、SRV の customer-app と別にする（同じ名前を両方で登録するとぶつかるという記録がある）
  CustomerAppService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: customer-app
      TaskDefinition: !Ref CustomerAppTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      # Running のとき 2 タスクに固定する（判断 56、61）。状態は共有の Aurora にあるので、どちらのタスクに当たってもよい。
      # MaximumPercent を 100 にすると、AZ の偏りを ECS が直さない（AvailabilityZoneRebalancing の条件。ECS の資料）
      DesiredCount: !If [Run, 2, 0]
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      # 2 タスクを、AZ に散らし、同じ AZ の中でも別のインスタンスに散らす。1 台を止めても、片方が残るように（段 D の D1-a3）
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }, { Type: spread, Field: instanceId }]
      HealthCheckGracePeriodSeconds: 60
      ServiceRegistries: [{ RegistryArn: !GetAtt CustomerAppDiscovery.Arn, ContainerName: app, ContainerPort: 8080 }]
      # 直送の受け口（9443）は、保険会社のシステムが customer-app-notice:9443 で呼ぶ。SRV の customer-app とは別の名前にする
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub "svc.${Prefix}.internal"
        Services: [{ PortName: notice, DiscoveryName: customer-app-notice, ClientAliases: [{ Port: 9443, DnsName: customer-app-notice }] }]

  # 営業 AI エージェント（台本。段 D の D1-a2-2）。受け口は SVID の mTLS（8443）で、顧客のアプリの BFF だけが呼ぶ。
  # A は、ログインサーバーの公開鍵（CloudFront を通した公開の名前）で確かめ、事務サービスを呼ぶたびに auth で B に替える
  SalesAgentTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Sales agent (scripted, or the real Claude through the Agent SDK). SVID mTLS ingress on 8443 for the customer app BFF only; exchanges token A for B at auth before each MCP call
    Properties:
      Family: !Sub "${Prefix}-sales-agent"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !Ref ExecutionRoleArn
      Volumes:
        - { Name: config, Host: { SourcePath: /etc/gekko13/spire } }
        - { Name: sockets, Host: { SourcePath: /var/run/gekko13/spire-sockets } }
        - { Name: svid }
      ContainerDefinitions:
        - Name: svid-helper
          Image: !Ref SpiffeHelperImage
          Essential: true
          MemoryReservation: 32
          Command: ["-config", "/etc/gekko13/spire/helper.conf"]
          MountPoints:
            - { SourceVolume: config, ContainerPath: /etc/gekko13/spire, ReadOnly: true }
            - { SourceVolume: sockets, ContainerPath: /run/spire/sockets, ReadOnly: true }
            - { SourceVolume: svid, ContainerPath: /svid }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: sales-agent, mode: non-blocking }
        - Name: app
          # 本物の Claude のときは、Claude Code の本体を入れたイメージにする。1 回ごとに Claude Code のプロセスを起こすので、約 200 MiB 多く取る（findings 5-40）
          Image: !If [Claude, !Ref SalesAgentImage, !Ref AppImage]
          Essential: true
          MemoryReservation: !If [Claude, 384, 128]
          PortMappings: [{ Name: app, ContainerPort: 8443, Protocol: tcp }]
          # 受け口は mTLS だけなので、受けられるかだけを見る
          HealthCheck:
            Command: [CMD, nc, -z, 127.0.0.1, "8443"]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - { Name: SERVICE, Value: sales-agent }
            - { Name: ENGINE, Value: !Ref SalesAgentEngine }
            - !If [Tracing, { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: "http://172.17.0.1:4318" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_SERVICE_NAME, Value: "sales-agent" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_METRICS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_LOGS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: NODE_OPTIONS, Value: "--import=/app/packages/tracing/src/register.ts" }, !Ref AWS::NoValue]
            - { Name: SVID_DIR, Value: /svid }
            - { Name: TRUST_DOMAIN, Value: gekko13.internal }
            - { Name: LOGIN_ISSUER, Value: !Sub "https://${RpId}/login/realms/insurer" }
            # 会話は、共有の Aurora に置き、どのタスクでも次の回を続ける（段 D の D1-a3。判断 55）。署名した書類が入るので、暗号化する
            - { Name: DB_URL, Value: !Sub "postgres://${DbHost}:5432/sales_agent" }
            - { Name: DB_USER, Value: sales_agent }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbSalesAgentPasswordParameter}" }
            - { Name: DB_CA_PEM, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}" }
            - !If [Claude, { Name: CLAUDE_CODE_OAUTH_TOKEN, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SalesAgentClaudeTokenParameter}" }, !Ref AWS::NoValue]
            - { Name: STATE_KEY, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SalesAgentStateKeyParameter}" }
          MountPoints:
            - { SourceVolume: svid, ContainerPath: /svid, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: sales-agent, mode: non-blocking }

  # 事務サービス（Python。段 D の D1-a2-2）。受け口は SVID の mTLS（9443）で、営業 AI エージェントだけが呼ぶ。B を確かめ、C に替えて保険会社のシステムを呼ぶ
  InsurerMcpTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          MCP office service (Python). SVID mTLS ingress on 9443 for the sales agent only; verifies B and exchanges it for C
    Properties:
      Family: !Sub "${Prefix}-insurer-mcp"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !Ref ExecutionRoleArn
      Volumes:
        - { Name: config, Host: { SourcePath: /etc/gekko13/spire } }
        - { Name: sockets, Host: { SourcePath: /var/run/gekko13/spire-sockets } }
        - { Name: svid }
      ContainerDefinitions:
        - Name: svid-helper
          Image: !Ref SpiffeHelperImage
          Essential: true
          MemoryReservation: 32
          Command: ["-config", "/etc/gekko13/spire/helper.conf"]
          MountPoints:
            - { SourceVolume: config, ContainerPath: /etc/gekko13/spire, ReadOnly: true }
            - { SourceVolume: sockets, ContainerPath: /run/spire/sockets, ReadOnly: true }
            - { SourceVolume: svid, ContainerPath: /svid }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: insurer-mcp, mode: non-blocking }
        - Name: app
          Image: !Ref McpImage
          Essential: true
          MemoryReservation: 128
          # svid-helper は鍵を root のグループで 0640 にして書く。app は root でない利用者のまま、グループだけ root にして読む
          User: "1000:0"
          PortMappings: [{ Name: app, ContainerPort: 9443, Protocol: tcp }]
          HealthCheck:
            Command: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 9443), 3)"]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - !If [Tracing, { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: "http://172.17.0.1:4318" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_SERVICE_NAME, Value: "insurer-mcp" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_METRICS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_LOGS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - { Name: SVID_DIR, Value: /svid }
            - { Name: TRUST_DOMAIN, Value: gekko13.internal }
          MountPoints:
            - { SourceVolume: svid, ContainerPath: /svid, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: insurer-mcp, mode: non-blocking }

  # 保険会社のシステム（Java。段 D の D1-a2-2）。受け口は SVID の mTLS（9443）で、事務サービスが C で呼ぶ。顧客のアプリは提示の公開鍵を取る。
  # auth（連絡先、passkey、有効性の問い合わせ）と、顧客のアプリの直送の受け口を、相手の SPIFFE ID を確かめる mTLS で呼ぶ
  InsurerBackendTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Insurer backend (Java). SVID mTLS ingress on 9443; verifies C; calls auth and the customer app notice port over SPIFFE-ID-checked mTLS
    Properties:
      Family: !Sub "${Prefix}-insurer-backend"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !Ref ExecutionRoleArn
      Volumes:
        - { Name: config, Host: { SourcePath: /etc/gekko13/spire } }
        - { Name: sockets, Host: { SourcePath: /var/run/gekko13/spire-sockets } }
        - { Name: svid }
      ContainerDefinitions:
        - Name: svid-helper
          Image: !Ref SpiffeHelperImage
          Essential: true
          MemoryReservation: 32
          Command: ["-config", "/etc/gekko13/spire/helper.conf"]
          MountPoints:
            - { SourceVolume: config, ContainerPath: /etc/gekko13/spire, ReadOnly: true }
            - { SourceVolume: sockets, ContainerPath: /run/spire/sockets, ReadOnly: true }
            - { SourceVolume: svid, ContainerPath: /svid }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: insurer-backend, mode: non-blocking }
        - Name: app
          Image: !Ref BackendImage
          Essential: true
          # JVM はこの上限の 75% をヒープにする（Dockerfile の MaxRAMPercentage）
          Memory: 512
          User: "1000:0"
          PortMappings: [{ Name: app, ContainerPort: 9443, Protocol: tcp }]
          HealthCheck:
            Command: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9443"]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          Environment:
            - !If [Tracing, { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: "http://172.17.0.1:4318" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_SERVICE_NAME, Value: "insurer-backend" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_METRICS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_LOGS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_BSP_SCHEDULE_DELAY, Value: "2000" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: JAVA_TOOL_OPTIONS, Value: "-javaagent:/app/otel.jar" }, !Ref AWS::NoValue]
            # 5 秒ごとの送り直しの処理は、トレースしない（Redeliverer）
            - !If [Tracing, { Name: OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED, Value: "false" }, !Ref AWS::NoValue]
            - { Name: SVID_DIR, Value: /svid }
            - { Name: TRUST_DOMAIN, Value: gekko13.internal }
            - { Name: RP_ID, Value: !Ref RpId }
            - { Name: WEBAUTHN_ORIGINS, Value: !Sub "https://${RpId}" }
            - { Name: CUSTOMER_APP_URL, Value: https://customer-app-notice:9443 }
            # nonce、契約、送り出しは、共有の Aurora に置く（段 D の D1-a3）。Aurora の証明書を確かめる（DB_CA_PEM を、起動のときにファイルに書く）
            - { Name: DB_URL, Value: !Sub "jdbc:postgresql://${DbHost}:5432/backend?sslmode=verify-full&sslrootcert=/tmp/db-ca.pem" }
            - { Name: DB_USER, Value: backend }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbBackendPasswordParameter}" }
            - { Name: DB_CA_PEM, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}" }
            # 2 つのタスクが同じ鍵で提示に署名し、確かめる（判断 53）
            - { Name: OFFER_SIGNING_KEY, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OfferSigningKeyParameter}" }
          MountPoints:
            - { SourceVolume: svid, ContainerPath: /svid, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: insurer-backend, mode: non-blocking }

  SalesAgentService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: sales-agent
      TaskDefinition: !Ref SalesAgentTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      # Running のとき 2 タスクに固定する（判断 56、61）。状態は共有の Aurora にあるので、どちらのタスクに当たってもよい。
      # MaximumPercent を 100 にすると、AZ の偏りを ECS が直さない（AvailabilityZoneRebalancing の条件。ECS の資料）
      DesiredCount: !If [Run, 2, 0]
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      # 2 タスクを、AZ に散らし、同じ AZ の中でも別のインスタンスに散らす。1 台を止めても、片方が残るように（段 D の D1-a3）
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }, { Type: spread, Field: instanceId }]
      HealthCheckGracePeriodSeconds: 120
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub "svc.${Prefix}.internal"
        Services: [{ PortName: app, DiscoveryName: sales-agent, ClientAliases: [{ Port: 8443, DnsName: sales-agent }] }]

  InsurerMcpService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: insurer-mcp
      TaskDefinition: !Ref InsurerMcpTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      # Running のとき 2 タスクに固定する（判断 56、61）。状態は共有の Aurora にあるので、どちらのタスクに当たってもよい。
      # MaximumPercent を 100 にすると、AZ の偏りを ECS が直さない（AvailabilityZoneRebalancing の条件。ECS の資料）
      DesiredCount: !If [Run, 2, 0]
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      # 2 タスクを、AZ に散らし、同じ AZ の中でも別のインスタンスに散らす。1 台を止めても、片方が残るように（段 D の D1-a3）
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }, { Type: spread, Field: instanceId }]
      HealthCheckGracePeriodSeconds: 120
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub "svc.${Prefix}.internal"
        Services: [{ PortName: app, DiscoveryName: insurer-mcp, ClientAliases: [{ Port: 9443, DnsName: insurer-mcp }] }]

  InsurerBackendService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: insurer-backend
      TaskDefinition: !Ref InsurerBackendTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      # Running のとき 2 タスクに固定する（判断 56、61）。状態は共有の Aurora にあるので、どちらのタスクに当たってもよい。
      # MaximumPercent を 100 にすると、AZ の偏りを ECS が直さない（AvailabilityZoneRebalancing の条件。ECS の資料）
      DesiredCount: !If [Run, 2, 0]
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      # 2 タスクを、AZ に散らし、同じ AZ の中でも別のインスタンスに散らす。1 台を止めても、片方が残るように（段 D の D1-a3）
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }, { Type: spread, Field: instanceId }]
      HealthCheckGracePeriodSeconds: 120
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub "svc.${Prefix}.internal"
        Services: [{ PortName: app, DiscoveryName: insurer-backend, ClientAliases: [{ Port: 9443, DnsName: insurer-backend }] }]

  # 監査サービス（Go。段 D の D1-a2-3）。入口のリバースプロキシが /audit の下を送る（SRV の insurer-audit）。
  # 監査の記録は、CloudWatch Logs のロググループを、タスクのロールで読む。書いた者は、ログストリームの名前で決める。
  # 読む権限は、このタスクのロールにだけ与える。ほかのタスクには、タスクのロールを付けない（ログを書くのは、インスタンスの docker）
  InsurerAuditDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: insurer-audit
      NamespaceId: !Ref NamespaceId
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: SRV, TTL: 10 }]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  InsurerAuditTaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: The audit service reads audit records from the ECS log group; the writer is decided by the log stream name
        must: Never grant write access to logs here, and never attach this role to other tasks
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*" }
      Policies:
        - PolicyName: read-audit-records
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*"

  InsurerAuditTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Audit service (Go). Serves /audit for the entry relay on 8080. Auditors log in with OIDC; the client authenticates to Keycloak
          with a JWT-SVID. Reads audit records from CloudWatch Logs with its task role and the backend self-report over SVID mTLS
    Properties:
      Family: !Sub "${Prefix}-insurer-audit"
      RequiresCompatibilities: [EC2]
      NetworkMode: bridge
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !GetAtt InsurerAuditTaskRole.Arn
      Volumes:
        - { Name: helper }
        - { Name: sockets, Host: { SourcePath: /var/run/gekko13/spire-sockets } }
        - { Name: svid }
      ContainerDefinitions:
        - Name: helper-config
          Image: !Ref AppImage
          Essential: false
          MemoryReservation: 16
          Command: ["sh", "scripts/helper-conf.sh", "/helper/helper.conf"]
          Environment:
            - { Name: JWT_AUDIENCE, Value: !Sub "https://${RpId}/login/realms/insurer" }
          MountPoints:
            - { SourceVolume: helper, ContainerPath: /helper }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: insurer-audit, mode: non-blocking }
        - Name: svid-helper
          Image: !Ref SpiffeHelperImage
          Essential: true
          MemoryReservation: 32
          Command: ["-config", "/helper/helper.conf"]
          DependsOn: [{ ContainerName: helper-config, Condition: SUCCESS }]
          MountPoints:
            - { SourceVolume: helper, ContainerPath: /helper, ReadOnly: true }
            - { SourceVolume: sockets, ContainerPath: /run/spire/sockets, ReadOnly: true }
            - { SourceVolume: svid, ContainerPath: /svid }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: insurer-audit, mode: non-blocking }
        - Name: app
          Image: !Ref AuditImage
          Essential: true
          MemoryReservation: 64
          User: "1000:0"
          PortMappings: [{ ContainerPort: 8080, HostPort: 0, Protocol: tcp }]
          # 土台にシェルがないので、ヘルスチェックは置かない（ECS は、コンテナが動いていれば正常とみなす）
          Environment:
            - !If [Tracing, { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: "http://172.17.0.1:4318" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_SERVICE_NAME, Value: "insurer-audit" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_METRICS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - !If [Tracing, { Name: OTEL_LOGS_EXPORTER, Value: "none" }, !Ref AWS::NoValue]
            - { Name: SVID_DIR, Value: /svid }
            - { Name: JWT_SVID_FILE, Value: /svid/jwt_svid.token }
            - { Name: TRUST_DOMAIN, Value: gekko13.internal }
            - { Name: ISSUER, Value: !Sub "https://${RpId}/login/realms/insurer" }
            - { Name: PUBLIC_ORIGIN, Value: !Sub "https://${RpId}/audit" }
            - { Name: LOG_GROUP, Value: !Ref LogGroupName }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            # 監査の担当のセッションは、共有の Aurora に置く（段 D の D1-a3）
            - { Name: DB_URL, Value: !Sub "postgres://${DbHost}:5432/audit" }
            - { Name: DB_USER, Value: audit }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbAuditPasswordParameter}" }
            - { Name: DB_CA_PEM, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}" }
          MountPoints:
            - { SourceVolume: svid, ContainerPath: /svid, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: insurer-audit, mode: non-blocking }

  InsurerAuditService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      ServiceName: insurer-audit
      TaskDefinition: !Ref InsurerAuditTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProviderName, Weight: 1 }]
      # Running のとき 2 タスクに固定する（判断 56、61）。状態は共有の Aurora にあるので、どちらのタスクに当たってもよい。
      # MaximumPercent を 100 にすると、AZ の偏りを ECS が直さない（AvailabilityZoneRebalancing の条件。ECS の資料）
      DesiredCount: !If [Run, 2, 0]
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 200 }
      AvailabilityZoneRebalancing: ENABLED
      # 2 タスクを、AZ に散らし、同じ AZ の中でも別のインスタンスに散らす。1 台を止めても、片方が残るように（段 D の D1-a3）
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }, { Type: spread, Field: instanceId }]
      ServiceRegistries: [{ RegistryArn: !GetAtt InsurerAuditDiscovery.Arn, ContainerName: app, ContainerPort: 8080 }]
      # 保険会社のシステムを Service Connect の名前で呼ぶ（クライアントだけ）
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub "svc.${Prefix}.internal"
