AWSTemplateFormatVersion: "2010-09-09"
# gekko13 の検証のネットワークと、SPIRE server の状態を置く EFS。IPv6 を軸にし、NAT ゲートウェイも VPC エンドポイントも置かない（固定費を出さない）。
# サブネットはプライベートにする。IGW への経路を持たず、外へは Egress-only のインターネットゲートウェイ（EIGW）から IPv6 で出る。
# 外からは、入口の中継（Web Functions。段 D の D0-b）が NetworkConnector で VPC に置く ENI からだけ受ける。サブネットは 2 つの AZ に 1 つずつ。
# CloudFormation は ASCII 以外の文字を「?」に置き換えるので、Description と Metadata は英語で書く（docs/findings.md）。
Description: >-
  gekko13 network and the EFS that holds SPIRE server state. IPv6 first, with no NAT gateway and no VPC endpoints (no fixed monthly cost).
  Subnets are private: no route to the internet gateway; egress goes over IPv6 through an egress-only internet gateway.
  The only inbound path from outside is the entry relay (a Lambda Web Function) through the ENIs of its network connector.
  One subnet in each of two AZs.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Prefix:
    Type: String
    Default: gekko13
  VpcCidr:
    Type: String
    Default: 10.13.0.0/16
  SubnetCidr:
    Type: String
    Default: 10.13.0.0/24
  Subnet2Cidr:
    Type: String
    Default: 10.13.1.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref Prefix }]

  Ipv6Block:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref Vpc
      AmazonProvidedIpv6CidrBlock: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Ref Prefix }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # 1 つめの AZ のサブネット。段 A（1 AZ）は、ここだけに台を置く。IPv6 で外へ出る。
  # 公開 IPv4 を自動で付けない（付けると 1 時間ごとに課金される）。
  Subnet:
    Type: AWS::EC2::Subnet
    DependsOn: Ipv6Block
    Metadata:
      com.aws.cloudformation.Context:
        why: First-AZ subnet. Stage A (single AZ) places hosts here only. Egress goes over IPv6
        must: Never auto-assign public IPv4 (billed per hour)
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Ipv6CidrBlock: !Select [0, !Cidr [!Select [0, !GetAtt Vpc.Ipv6CidrBlocks], 2, 64]]
      AssignIpv6AddressOnCreation: true
      MapPublicIpOnLaunch: false
      EnableDns64: false
      Tags: [{ Key: Name, Value: !Ref Prefix }]

  # 2 つめの AZ のサブネット。段 B（マルチ AZ）で台を置く。段 A では EFS のマウントターゲットだけがある。
  Subnet2:
    Type: AWS::EC2::Subnet
    DependsOn: Ipv6Block
    Metadata:
      com.aws.cloudformation.Context:
        why: Second-AZ subnet for stage B (multi-AZ). In stage A it only holds an EFS mount target
        must: Never auto-assign public IPv4 (billed per hour)
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref Subnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Ipv6CidrBlock: !Select [1, !Cidr [!Select [0, !GetAtt Vpc.Ipv6CidrBlocks], 2, 64]]
      AssignIpv6AddressOnCreation: true
      MapPublicIpOnLaunch: false
      EnableDns64: false
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-2" }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Ref Prefix }]

  # 外から始まる IPv6 の接続を通さない出口。ゲートウェイの料金はない（転送の分だけ）
  EgressOnlyGateway:
    Type: AWS::EC2::EgressOnlyInternetGateway
    Properties:
      VpcId: !Ref Vpc

  # IGW への経路は置かない（VPC origin はプライベートのサブネットを求める）。IGW は VPC に付けたままにする（VPC origin の条件）
  Ipv6DefaultRoute:
    Type: AWS::EC2::Route
    Metadata:
      com.aws.cloudformation.Context:
        why: Egress over IPv6 only, through the egress-only internet gateway, so the subnets stay private for CloudFront VPC origins
        must: Never add a route to the internet gateway (IPv4 or IPv6)
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationIpv6CidrBlock: "::/0"
      EgressOnlyInternetGatewayId: !Ref EgressOnlyGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  Subnet2RouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref RouteTable

  # ホスト、SPIRE server のタスクの ENI（awsvpc）、EFS のマウントターゲットが共有するグループ。
  # VPC の外からの通信を受けない。受けるのは、同じグループの中からだけ（台をまたぐ Service Connect、SPIRE の 8081、EFS の 2049）。
  # 入ってくる規則を外へ広げない。外からの入口は、入口の中継のグループからだけにする（HostIngressFromEntry）。
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Shared by hosts, the SPIRE server task ENI (awsvpc) and EFS mount targets.
          Inbound is accepted only from members of this group (cross-host Service Connect, SPIRE 8081, EFS 2049)
        must: Never open inbound beyond this group and the entry relay group
    Properties:
      GroupDescription: gekko13 ECS hosts (inbound only from this group)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: AWS APIs and ECR over IPv6 }
        - { IpProtocol: udp, FromPort: 123, ToPort: 123, CidrIp: 169.254.169.123/32, Description: Amazon Time Sync }
      Tags: [{ Key: Name, Value: !Ref Prefix }]

  HostIngressFromGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref HostSecurityGroup
      SourceSecurityGroupId: !Ref HostSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      Description: members of this group only

  HostEgressToGroup:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref HostSecurityGroup
      DestinationSecurityGroupId: !Ref HostSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      Description: members of this group only

  # 段 D の D0-b: 入口の中継（Web Functions）が、NetworkConnector で VPC に ENI を置き、台のタスクへ送る。
  # 中継のグループは何も受けず、台の動的なポート（bridge のタスクの受け口）と、VPC の DNS へだけ出る。
  # VPC の DNS（Amazon が用意する名前の解決）への通信は、グループの規則に依らず通る（AWS の資料）。規則は、出口を明示するために書く。
  EntrySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Stage D0-b. ENIs of the entry relay (Lambda Web Function network connector). No inbound. Outbound only to the dynamic
          host ports of bridge-mode tasks and to the Amazon-provided DNS
        must: Never add inbound rules. Never open outbound beyond the hosts and DNS
    Properties:
      GroupDescription: gekko13 entry relay (no inbound; outbound only to host dynamic ports and DNS)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 32768, ToPort: 65535, DestinationSecurityGroupId: !Ref HostSecurityGroup, Description: dynamic host ports }
        - { IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: 169.254.169.253/32, Description: Amazon-provided DNS }
        - { IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: 169.254.169.253/32, Description: Amazon-provided DNS }
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-entry" }]

  # 台は、入口の中継からだけ、動的なホストのポートを受ける。外からの受信は、この規則のほかに足さない。
  HostIngressFromEntry:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      com.aws.cloudformation.Context:
        why: Stage D0-b. Hosts accept the dynamic host ports of bridge-mode tasks only from the entry relay
        must: Add no other inbound rule from outside the group
    Properties:
      GroupId: !Ref HostSecurityGroup
      SourceSecurityGroupId: !Ref EntrySecurityGroup
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      Description: entry relay only

  # SPIRE server のデータストア（sqlite）と鍵、agent が最初に信じるバンドル。
  # ECS のスタックを作り直しても、台が入れ替わっても、CA と登録が残るように、ECS の外に置く。
  FileSystem:
    Type: AWS::EFS::FileSystem
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Holds the SPIRE server datastore (sqlite), its keys and the bootstrap bundle for agents.
          Lives outside the ECS stack so the CA and entries survive host replacement and ECS stack recreation
        must: Keep encryption at rest on. Deleting this file system rotates the SPIRE CA
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags: [{ Key: Name, Value: !Ref Prefix }]

  MountTarget:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref Subnet
      SecurityGroups: [!Ref HostSecurityGroup]

  MountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref Subnet2
      SecurityGroups: [!Ref HostSecurityGroup]

  # spire-server のイメージは uid 1000 で動く。アクセスポイントで、EFS の上の所有者を 1000 に揃える。
  SpireServerAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: "1000", Gid: "1000" }
      RootDirectory:
        Path: /spire-server
        CreationInfo: { OwnerUid: "1000", OwnerGid: "1000", Permissions: "0700" }

  BundleAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: "1000", Gid: "1000" }
      RootDirectory:
        Path: /bundle
        CreationInfo: { OwnerUid: "1000", OwnerGid: "1000", Permissions: "0755" }

Outputs:
  VpcId: { Value: !Ref Vpc }
  RouteTableId: { Value: !Ref RouteTable }
  SubnetId: { Value: !Ref Subnet }
  # 段 A は 1 つめだけ、段 B は 2 つとも使う
  SubnetIds: { Value: !Join [",", [!Ref Subnet, !Ref Subnet2]] }
  HostSecurityGroupId: { Value: !Ref HostSecurityGroup }
  EntrySecurityGroupId: { Value: !Ref EntrySecurityGroup }
  FileSystemId: { Value: !Ref FileSystem }
  SpireServerAccessPointId: { Value: !Ref SpireServerAccessPoint }
  BundleAccessPointId: { Value: !Ref BundleAccessPoint }
