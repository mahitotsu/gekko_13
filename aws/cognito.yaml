AWSTemplateFormatVersion: "2010-09-09"
# gekko13 の検証の Cognito。利用者のトークンをマネージドログイン v2 で出し、BFF と transfer が token exchange（委任）で発行し直す。
# BFF と transfer の client の秘密は、デプロイの手順が SSM の SecureString に写す（このテンプレートには出さない）。
# CloudFormation は ASCII 以外の文字を「?」に置き換えるので、Description と Metadata は英語で書く（docs/findings.md）。
Description: >-
  gekko13 Cognito. User tokens come from managed login v2; BFF and transfer reissue them by token exchange (delegation).
  The deploy script copies the BFF and transfer client secrets into SSM SecureString (never in this template).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Prefix:
    Type: String
    Default: gekko13
  DomainPrefix:
    Type: String
    Description: Managed login domain prefix. Must be unique within the region
    AllowedPattern: "[a-z0-9-]+"
  LoginCallbackUrl:
    Type: String
    Default: http://localhost:8765/callback
    Description: Redirect URI that scripts/aws-login.ts listens on

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    # token exchange は Essentials 以上の機能（ドキュメント）。UserPoolTier を LITE に下げない。
    Metadata:
      com.aws.cloudformation.Context:
        why: Token exchange requires the Essentials tier or higher (per the docs)
        must: Never downgrade UserPoolTier to LITE
    Properties:
      UserPoolName: !Ref Prefix
      UserPoolTier: ESSENTIALS
      DeletionProtection: INACTIVE
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      UsernameConfiguration: { CaseSensitive: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: admin_only, Priority: 1 }]
      Policies:
        PasswordPolicy: { MinimumLength: 16, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false }

  Domain:
    Type: AWS::Cognito::UserPoolDomain
    # 交換元にできるのは、マネージドログインで得たトークンだけ。ドメインは v2 にする（gekko_12 の実測 1-1）。
    Metadata:
      com.aws.cloudformation.Context:
        why: Only tokens from managed login can be exchanged, so the domain must be v2 (gekko_12 measurement 1-1)
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2

  BankingResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: banking
      Name: banking
      Scopes:
        - { ScopeName: view, ScopeDescription: view accounts }
        - { ScopeName: transfer, ScopeDescription: execute transfers }

  InternalResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: internal
      Name: internal
      Scopes:
        - { ScopeName: actor, ScopeDescription: actor token for delegation }

  # 利用者の画面の client。検証ではブラウザでのログインに使うだけ（PKCE、秘密なし）
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: BankingResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Prefix}-app"
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, banking/view, banking/transfer]
      CallbackURLs: [!Ref LoginCallbackUrl]
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: minutes }

  AppLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    # マネージドログイン v2 は、client ごとにブランドの設定がないとログイン画面を出さない（推定）。
    Metadata:
      com.aws.cloudformation.Context:
        why: Managed login v2 shows no login page for a client without branding (assumed)
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref AppClient
      UseCognitoProvidedValues: true

  BffClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: [BankingResourceServer, InternalResourceServer]
    Metadata:
      cfn-lint:
        config:
          # ALLOW_TOKEN_EXCHANGE_DELEGATION は 2026-11 の機能で、cfn-lint の値の一覧にまだない。ドキュメントの値を使う（通るかは未確認）
          ignore_checks: [E3030]
      # BFF が token exchange（委任）で利用者のトークンを発行し直す。actor のトークンは client_credentials で得る。
      # 委任は ExplicitAuthFlows の ALLOW_TOKEN_EXCHANGE_DELEGATION で許す（ドキュメント。CloudFormation で通るかは未確認）。
      # 交換で出せる scope は、ここで許した scope に限られる。banking の scope を外すと交換できない。
      com.aws.cloudformation.Context:
        why: >-
          BFF reissues the user token by token exchange (delegation); its actor token comes from client_credentials.
          Delegation is allowed by ALLOW_TOKEN_EXCHANGE_DELEGATION in ExplicitAuthFlows (per the docs)
        must: Exchanged tokens can carry only the scopes allowed here. Removing the banking scopes breaks the exchange
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Prefix}-bff"
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [internal/actor, banking/view, banking/transfer]
      ExplicitAuthFlows: [ALLOW_TOKEN_EXCHANGE_DELEGATION, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 5
      TokenValidityUnits: { AccessToken: minutes }

  TransferClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: [BankingResourceServer, InternalResourceServer]
    Metadata:
      cfn-lint:
        config:
          # ALLOW_TOKEN_EXCHANGE_DELEGATION は 2026-11 の機能で、cfn-lint の値の一覧にまだない。ドキュメントの値を使う（通るかは未確認）
          ignore_checks: [E3030]
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Prefix}-transfer"
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [internal/actor, banking/view, banking/transfer]
      ExplicitAuthFlows: [ALLOW_TOKEN_EXCHANGE_DELEGATION, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 5
      TokenValidityUnits: { AccessToken: minutes }

Outputs:
  UserPoolId: { Value: !Ref UserPool }
  Issuer: { Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}" }
  TokenUrl: { Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token" }
  AuthorizeUrl: { Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize" }
  AppClientId: { Value: !Ref AppClient }
  BffClientId: { Value: !Ref BffClient }
  TransferClientId: { Value: !Ref TransferClient }
