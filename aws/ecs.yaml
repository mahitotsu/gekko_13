AWSTemplateFormatVersion: "2010-09-09"
# gekko13 の検証の実行基盤（段 D の D0 から、基盤とアプリの 2 つのスタックに分けた。アプリは aws/apps.yaml）。
# ECS の EC2 で、キャパシティプロバイダー（ASG、0〜MaxInstances 台）に、SPIRE の server と agent を載せる。入口（段 D の D0-b から Web Functions の中継）は aws/entry.yaml に置く。
# 台の数と AZ を前提にしない。アプリどうしは Service Connect（TCP の中継だけ）で呼び、mTLS はアプリが終える。
# agent は Cloud Map の DNS 名で server に届く。server は 2 タスクで、状態を共有の Aurora（aws/db.yaml）に置き、共有の根の CA の下で中間の CA を作る。
# agent が最初に信じるバンドル（根の証明書）は EFS に置く（network のスタック）。
# 使わない間は aws/scale.sh down で、タスク数を 0 にし、台も 0 にする。AWS の名前は、IPv6 で届くデュアルスタックのものを使う。
# CloudFormation は ASCII 以外の文字を「?」に置き換えるので、Description と Metadata は英語で書く（docs/findings.md）。
Description: >-
  gekko13 base runtime on ECS (EC2) with a capacity provider (ASG, 0 to MaxInstances hosts): SPIRE server and agent. The entry relay lives in aws/entry.yaml.
  Apps live in the gekko13-apps stack (aws/apps.yaml). Nothing assumes a host count or AZ. Apps call each other through Service Connect (TCP only)
  and terminate mTLS themselves. Agents reach the server by a Cloud Map DNS name. Two server tasks share state in Aurora (aws/db.yaml) and mint
  intermediate CAs under one shared root, so the trust bundle stays the same across restarts. Scale to zero with aws/scale.sh down.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Prefix:
    Type: String
    Default: gekko13
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for hosts and the SPIRE server task. One for stage A, two AZs for stage B
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  FileSystemId:
    Type: String
  SpireServerAccessPointId:
    Type: String
  BundleAccessPointId:
    Type: String
  InstanceTypes:
    Type: CommaDelimitedList
    Default: t4g.medium,c6g.large,c7g.large,t4g.large
    Description: >-
      Exactly four arm64 instance types for the Spot pool, cheapest first. Two vCPUs and at least 4 GiB each,
      so that any of them fits the same tasks
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id
  AssignPublicIpv4:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set true only while working, if some AWS API is unreachable over IPv6 alone (billed per hour)
  MaxInstances:
    Type: String
    Default: "4"
    Description: Upper bound of the Auto Scaling group. The capacity provider scales between 0 and this
  AppImage:
    Type: String
    Description: URI and tag of the gekko13/node image in ECR
  SpireServerImage:
    Type: String
  SpireAgentImage:
    Type: String
  SpiffeHelperImage:
    Type: String
  SvidTtlSeconds:
    Type: Number
    Default: 300
  AuthStandinParameter:
    Type: String
    Default: /gekko13/auth/standin-secret
    Description: SSM SecureString holding the client secret of the user stand-in client of the authorization server. Created by the deploy script
  DbInitImage:
    Type: String
    Description: URI and tag of the gekko13/db-init image in ECR (services/db-init)
  DbHost:
    Type: String
    Description: Aurora cluster endpoint (gekko13-db output DbHost)
  DbAdminUser:
    Type: String
    Default: gekko13admin
  DbMasterPasswordParameter:
    Type: String
    Default: /gekko13/db/master-password
  DbSpirePasswordParameter:
    Type: String
    Default: /gekko13/db/spire-password
  DbKeycloakPasswordParameter:
    Type: String
    Default: /gekko13/db/keycloak-password
  DbAuthPasswordParameter:
    Type: String
    Default: /gekko13/db/auth-password
  DbCaParameter:
    Type: String
    Default: /gekko13/db/ca
    Description: SSM String holding the Aurora CA certificate (aws/rds-ca.pem)
  AuthSigningKeyParameter:
    Type: String
    Default: /gekko13/auth/signing-key
  SpireRootCertParameter:
    Type: String
    Default: /gekko13/spire/root-cert
  SpireRootKeyParameter:
    Type: String
    Default: /gekko13/spire/root-key
  ContainerInsights:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Turn on only while measuring memory (stage C-3). Billed per metric while on



Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref Prefix
      ClusterSettings: [{ Name: containerInsights, Value: !Ref ContainerInsights }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Prefix}/ecs"
      RetentionInDays: 7

  # アプリどうしの Service Connect、SPIRE server の A レコード、入口の中継が引く SRV（段 D の D0-b）が使う名前空間。
  # プライベートのホストゾーンができるので、月に 0.5 ドルの固定費がかかる（持ち主が承認済み）。
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Metadata:
      com.aws.cloudformation.Context:
        why: Shared by Service Connect between apps, the SPIRE server A record and the SRV records the entry relay resolves
        must: Creates a private hosted zone with a fixed monthly fee (approved by the owner)
    Properties:
      Name: !Sub "svc.${Prefix}.internal"
      Vpc: !Ref VpcId

  # agent はホストのネットワークで動くので、Service Connect に加われない。server だけを awsvpc にし、A レコードで見つける。
  SpireServerDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Agents run on the host network and cannot join Service Connect.
          Only the server runs in awsvpc mode so that it gets an A record
    Properties:
      Name: spire-server
      NamespaceId: !Ref Namespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: A, TTL: 10 }]
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: task-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthStandinParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbMasterPasswordParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbSpirePasswordParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbKeycloakPasswordParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbAuthPasswordParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthSigningKeyParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SpireRootCertParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SpireRootKeyParameter}"
  SpireServerTaskRole:
    Type: AWS::IAM::Role
    # aws_iid のノードの確認で、SPIRE の server がインスタンスのタグを読む。権限を DescribeInstances より広げない。
    Metadata:
      com.aws.cloudformation.Context:
        why: The SPIRE server reads instance tags during aws_iid node attestation
        must: Grant nothing beyond DescribeInstances
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      Policies:
        - PolicyName: describe-instances
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: ec2:DescribeInstances, Resource: "*" }
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    # IMDSv2 を必須にし、応答のホップを 1 にする。bridge モードのコンテナはインスタンスの認証情報を取れず、
    # ホストのネットワークで動く SPIRE の agent だけが識別ドキュメントを取れる。HttpPutResponseHopLimit を 2 以上にしない。
    # サブネットは ASG が決める（起動テンプレートに SubnetId を書くと、ASG と重なる）。
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          IMDSv2 required with a hop limit of 1. Bridge-mode containers cannot get instance credentials;
          only the SPIRE agent on the host network can fetch the identity document
        must: Never raise HttpPutResponseHopLimit to 2 or more. Never set SubnetId here (the ASG chooses subnets)
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled, HttpProtocolIpv6: enabled }
        NetworkInterfaces:
          - DeviceIndex: 0
            Groups: [!Ref SecurityGroupId]
            AssociatePublicIpAddress: !Ref AssignPublicIpv4
            Ipv6AddressCount: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Ref Prefix }
              - { Key: gekko13-role, Value: ecs-host }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            # AWS の API は、IPv6 で届くデュアルスタックの名前を使う（既定の名前は IPv4 だけ。docs/findings.md）
            cat >> /etc/ecs/ecs.config <<'EOF'
            ECS_CLUSTER=${Prefix}
            ECS_ENABLE_TASK_IAM_ROLE=true
            ECS_ENABLE_TASK_IAM_ROLE_NETWORK_HOST=false
            ECS_ENABLE_SPOT_INSTANCE_DRAINING=true
            AWS_USE_DUALSTACK_ENDPOINT=true
            EOF

            # bridge のコンテナが IPv6 で外へ出られるようにする（ULA を ip6tables で変換する）。
            # この AMI の docker では、ip6tables に experimental が要る（推定。docs/findings.md の 5-3）
            mkdir -p /etc/docker
            cat > /etc/docker/daemon.json <<'EOF'
            {"experimental": true, "ipv6": true, "fixed-cidr-v6": "fd00:13::/64", "ip6tables": true}
            EOF
            # awslogs のドライバーは docker のデーモンの中で動く。ECS はタスク定義で awslogs-endpoint を受け付けないので、
            # デーモンに AWS SDK の環境変数を渡して、IPv6 で届く Logs の名前に向ける（docs/findings.md）
            mkdir -p /etc/systemd/system/docker.service.d
            cat > /etc/systemd/system/docker.service.d/gekko13-dualstack.conf <<'EOF'
            [Service]
            Environment=AWS_USE_DUALSTACK_ENDPOINT=true
            Environment=AWS_ENDPOINT_URL_CLOUDWATCH_LOGS=https://logs.${AWS::Region}.api.aws
            EOF
            systemctl daemon-reload
            systemctl restart docker

            mkdir -p /etc/gekko13/spire /var/lib/gekko13/spire-agent /var/run/gekko13/spire-sockets

            # どのホストでも同じ設定を書く。server は、置かれたホストでこの設定を読む
            cat > /etc/gekko13/spire/server.conf <<'EOF'
            server {
              bind_address = "0.0.0.0"
              bind_port    = "8081"
              socket_path  = "/run/spire/server-api/api.sock"
              trust_domain = "gekko13.internal"
              data_dir     = "/var/lib/spire/server"
              log_level    = "INFO"
              default_x509_svid_ttl = "5m"
              ca_ttl       = "24h"
            }
            plugins {
              # 2 つの server が、共有の Aurora に状態を置く。宛先とパスワードは、server の起動の -expandEnv で、タスクの環境変数から入る
              DataStore "sql" {
                plugin_data {
                  database_type     = "postgres"
                  connection_string = "dbname=spire user=spire password=${!SPIRE_DB_PASSWORD} host=${!DB_HOST} port=5432 sslmode=verify-full sslrootcert=/dbca/ca.pem"
                }
              }
              # 全部の server が、同じ根の CA の下で中間の CA を作る。バンドルは根の証明書だけになり、server が起き直しても変わらない。
              # 根の証明書と鍵は、aws/deploy.sh が作って SSM に置き、タスクの db-init のコンテナが書く
              UpstreamAuthority "disk" {
                plugin_data {
                  cert_file_path = "/spire-ca/root.crt"
                  key_file_path  = "/spire-ca/root.key"
                }
              }
              NodeAttestor "aws_iid" {
                plugin_data {
                  disable_instance_profile_selectors = true
                }
              }
              # 中間の CA の鍵は、タスクのメモリに置く。2 つの server で、鍵のファイルを奪い合わない。起き直すと、根の下で作り直す
              KeyManager "memory" {
                plugin_data {}
              }
            }
            EOF

            # aws_iid は、同じインスタンスで一度しか確認を通さない。agent の鍵とデータはホストのディスクに残す。
            # 最初に信じるバンドルは、server のタスクの registrar が EFS に書いたものを読む
            cat > /etc/gekko13/spire/agent.conf <<'EOF'
            agent {
              data_dir          = "/var/lib/spire/agent"
              log_level         = "INFO"
              server_address    = "spire-server.svc.${Prefix}.internal"
              server_port       = "8081"
              socket_path       = "/run/spire/sockets/agent.sock"
              trust_bundle_path = "/run/spire/bundle/bundle.crt"
              trust_domain      = "gekko13.internal"
            }
            plugins {
              NodeAttestor "aws_iid" {
                plugin_data {}
              }
              KeyManager "disk" {
                plugin_data {
                  directory = "/var/lib/spire/agent"
                }
              }
              WorkloadAttestor "docker" {
                plugin_data {}
              }
            }
            EOF

            cat > /etc/gekko13/spire/helper.conf <<'EOF'
            agent_address         = "/run/spire/sockets/agent.sock"
            cmd                   = ""
            cert_dir              = "/svid"
            svid_file_name        = "svid.pem"
            svid_key_file_name    = "svid_key.pem"
            svid_bundle_file_name = "svid_bundle.pem"
            daemon_mode           = true
            cert_file_mode        = 0644
            key_file_mode         = 0640
            EOF

  # 台の数は、キャパシティプロバイダーのマネージドスケーリングが決める（タスクが 0 なら 0 台）。
  # 台は、全部スポットで起こす（オンデマンドは 0 台）。種類は 4 つ並べ、空きが多く安いものから選ぶ（price-capacity-optimized）。
  # 中断の予告を受けると、ECS のエージェントが台からタスクを逃がす（UserData の ECS_ENABLE_SPOT_INSTANCE_DRAINING）。
  # CapacityRebalance で、中断の危険が高まった台を、前もって入れ替える。
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The capacity provider's managed scaling sets the desired capacity (zero hosts when no tasks).
          All hosts are Spot (no On-Demand base). Four arm64 types with price-capacity-optimized allocation;
          capacity rebalancing replaces hosts at elevated interruption risk
        must: Keep MinSize at 0. Do not set DesiredCapacity here
    Properties:
      AutoScalingGroupName: !Sub "${Prefix}-ecs"
      MinSize: "0"
      MaxSize: !Ref MaxInstances
      VPCZoneIdentifier: !Ref SubnetIds
      CapacityRebalance: true
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref LaunchTemplate
            Version: !GetAtt LaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Select [0, !Ref InstanceTypes]
            - InstanceType: !Select [1, !Ref InstanceTypes]
            - InstanceType: !Select [2, !Ref InstanceTypes]
            - InstanceType: !Select [3, !Ref InstanceTypes]
        InstancesDistribution:
          OnDemandBaseCapacity: 0
          OnDemandPercentageAboveBaseCapacity: 0
          SpotAllocationStrategy: price-capacity-optimized
      NewInstancesProtectedFromScaleIn: false
      Tags:
        - { Key: AmazonECSManaged, Value: "true", PropagateAtLaunch: true }

  # マネージドの終了保護は切る。スタックを消すときに、保護された台が残って止まるのを避けるため。
  # マネージドスケーリングは CloudWatch のアラームを 2 つ作る（月に約 0.2 ドル。持ち主が承認済み）。
  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Managed termination protection is off so that stack deletion is not blocked by protected hosts.
          Managed scaling creates two CloudWatch alarms with a small monthly fee (approved by the owner)
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 1
          InstanceWarmupPeriod: 120
        ManagedTerminationProtection: DISABLED
        ManagedDraining: ENABLED
  CapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]

  # server は 2 タスクで、状態を共有の Aurora に置く（段 D の D1-a1）。どちらの server の SVID も、同じ根の CA に連なる。
  # 最初に db-init のコンテナが動いて終わる。Aurora の CA と根の CA をタスクの中に書き、Aurora にデータベースとロールを作る（services/db-init）。
  # registrar は、登録を作り、バンドル（根の証明書）を EFS に書き続ける。2 つのタスクで同時に動いても、同じ登録は作らない。
  SpireServerTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Two server tasks share state in Aurora and mint intermediate CAs under one shared root (UpstreamAuthority disk).
          The db-init container runs first: it writes the Aurora CA and the root CA into task volumes and creates databases and roles.
          The registrar creates entries and keeps writing the bundle (the root certificate) to EFS
        must: Never put the root key on EFS or in the image. It comes only from SSM through ECS secrets into a task volume
    Properties:
      Family: !Sub "${Prefix}-spire-server"
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt SpireServerTaskRole.Arn
      Volumes:
        - { Name: config, Host: { SourcePath: /etc/gekko13/spire } }
        - Name: bundle
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystemId
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref BundleAccessPointId, IAM: DISABLED }
        - { Name: server-api }
        - { Name: server-data }
        - { Name: dbca }
        - { Name: spire-ca }
      ContainerDefinitions:
        - Name: db-init
          Image: !Ref DbInitImage
          Essential: false
          MemoryReservation: 32
          Environment:
            - { Name: DB_HOST, Value: !Ref DbHost }
            - { Name: DB_ADMIN_USER, Value: !Ref DbAdminUser }
          Secrets:
            - { Name: DB_ADMIN_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbMasterPasswordParameter}" }
            - { Name: DB_SPIRE_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbSpirePasswordParameter}" }
            - { Name: DB_KEYCLOAK_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbKeycloakPasswordParameter}" }
            - { Name: DB_AUTH_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbAuthPasswordParameter}" }
            - { Name: DB_CA_PEM, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbCaParameter}" }
            - { Name: SPIRE_ROOT_CERT, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SpireRootCertParameter}" }
            - { Name: SPIRE_ROOT_KEY, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SpireRootKeyParameter}" }
          MountPoints:
            - { SourceVolume: dbca, ContainerPath: /dbca }
            - { SourceVolume: spire-ca, ContainerPath: /spire-ca }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: spire-server, mode: non-blocking }
        # イメージは uid 1000 で動くが、タスクの中で共有するソケットのディレクトリは root の持ち物なので、root で動かす
        - Name: spire-server
          Image: !Ref SpireServerImage
          Essential: true
          User: "0"
          MemoryReservation: 96
          Command: ["-config", "/etc/gekko13/spire/server.conf", "-expandEnv"]
          DependsOn: [{ ContainerName: db-init, Condition: SUCCESS }]
          # 入れ替えのとき、新しい server が受けられるようになってから、古い server を止める。固まった server は入れ替える
          HealthCheck:
            Command: [CMD, /opt/spire/bin/spire-server, healthcheck, -socketPath, /run/spire/server-api/api.sock]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          PortMappings: [{ ContainerPort: 8081, Protocol: tcp }]
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_USE_DUALSTACK_ENDPOINT, Value: "true" }
            - { Name: DB_HOST, Value: !Ref DbHost }
          Secrets:
            - { Name: SPIRE_DB_PASSWORD, ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbSpirePasswordParameter}" }
          MountPoints:
            - { SourceVolume: config, ContainerPath: /etc/gekko13/spire, ReadOnly: true }
            - { SourceVolume: server-data, ContainerPath: /var/lib/spire/server }
            - { SourceVolume: server-api, ContainerPath: /run/spire/server-api }
            - { SourceVolume: dbca, ContainerPath: /dbca, ReadOnly: true }
            - { SourceVolume: spire-ca, ContainerPath: /spire-ca, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: spire-server, mode: non-blocking }
        - Name: registrar
          Image: !Ref AppImage
          Essential: true
          MemoryReservation: 32
          Command: ["sh", "scripts/spire-registrar.sh"]
          DependsOn: [{ ContainerName: spire-server, Condition: START }]
          Environment:
            - { Name: SPIRE_SOCKET, Value: /run/spire/server-api/api.sock }
            - { Name: TRUST_DOMAIN, Value: gekko13.internal }
            - { Name: PREFIX, Value: !Ref Prefix }
            - { Name: SVID_TTL, Value: !Ref SvidTtlSeconds }
            - { Name: BUNDLE_DIR, Value: /bundle }
          MountPoints:
            - { SourceVolume: server-api, ContainerPath: /run/spire/server-api }
            - { SourceVolume: bundle, ContainerPath: /bundle }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: spire-server, mode: non-blocking }
  SpireAgentTask:
    Type: AWS::ECS::TaskDefinition
    # docker の attestor は、呼び出し元の PID からコンテナを探す。ホストの PID と docker のソケットが要る。
    # IMDS に届くよう、ホストのネットワークで動かす。このタスクの外に、docker のソケットを渡さない。
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The docker attestor maps the caller PID to a container, so it needs the host PID namespace and the docker socket.
          Runs on the host network to reach IMDS
        must: Never expose the docker socket outside this task
    Properties:
      Family: !Sub "${Prefix}-spire-agent"
      RequiresCompatibilities: [EC2]
      NetworkMode: host
      PidMode: host
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      Volumes:
        - { Name: config, Host: { SourcePath: /etc/gekko13/spire } }
        - { Name: data, Host: { SourcePath: /var/lib/gekko13/spire-agent } }
        - Name: bundle
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystemId
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref BundleAccessPointId, IAM: DISABLED }
        - { Name: sockets, Host: { SourcePath: /var/run/gekko13/spire-sockets } }
        - { Name: docker, Host: { SourcePath: /var/run/docker.sock } }
      ContainerDefinitions:
        - Name: spire-agent
          Image: !Ref SpireAgentImage
          Essential: true
          MemoryReservation: 64
          Command: ["-config", "/etc/gekko13/spire/agent.conf"]
          MountPoints:
            - { SourceVolume: config, ContainerPath: /etc/gekko13/spire, ReadOnly: true }
            - { SourceVolume: data, ContainerPath: /var/lib/spire/agent }
            - { SourceVolume: bundle, ContainerPath: /run/spire/bundle, ReadOnly: true }
            - { SourceVolume: sockets, ContainerPath: /run/spire/sockets }
            - { SourceVolume: docker, ContainerPath: /var/run/docker.sock, ReadOnly: true }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: spire-agent, mode: non-blocking }
  SpireServerService:
    Type: AWS::ECS::Service
    DependsOn: CapacityProviderAssociation
    Properties:
      Cluster: !Ref Cluster
      ServiceName: spire-server
      TaskDefinition: !Ref SpireServerTask
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
      DesiredCount: 2
      # 1 つずつ入れ替える（台を足さずに、止まらずに更新する）。2 つの AZ に散らし、1 台に 1 つ
      DeploymentConfiguration: { MinimumHealthyPercent: 50, MaximumPercent: 100 }
      PlacementConstraints: [{ Type: distinctInstance }]
      PlacementStrategies: [{ Type: spread, Field: "attribute:ecs.availability-zone" }]
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref SecurityGroupId]
      ServiceRegistries: [{ RegistryArn: !GetAtt SpireServerDiscovery.Arn }]

  # DAEMON は、キャパシティプロバイダーの戦略を取れない。起動タイプ EC2 のまま、どの台にも 1 つ置く。
  SpireAgentService:
    Type: AWS::ECS::Service
    DependsOn: CapacityProviderAssociation
    Properties:
      Cluster: !Ref Cluster
      ServiceName: spire-agent
      TaskDefinition: !Ref SpireAgentTask
      LaunchType: EC2
      SchedulingStrategy: DAEMON


Outputs:
  ClusterName: { Value: !Ref Cluster }
  LogGroupName: { Value: !Ref LogGroup }
  AutoScalingGroupName: { Value: !Ref AutoScalingGroup }
  CapacityProviderName: { Value: !Ref CapacityProvider }
  NamespaceName: { Value: !Sub "svc.${Prefix}.internal" }
  NamespaceArn: { Value: !GetAtt Namespace.Arn }
  NamespaceId: { Value: !Ref Namespace }
  ExecutionRoleArn: { Value: !GetAtt ExecutionRole.Arn }
